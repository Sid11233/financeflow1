name: Deploy to staging

# Runs on every push to main, i.e. every merged PR. Two jobs, strictly
# ordered: migrate must succeed before deploy-functions starts. If
# `migrate` fails, GitHub Actions stops the workflow there by default
# (nothing here sets continue-on-error) — deploy-functions simply never
# runs, so a broken migration can never ship alongside functions built to
# expect it. There is deliberately no deploy-frontend job here — Vercel's
# own Git integration already builds and deploys this project on every
# push, so a second Actions-driven deploy would just be a redundant,
# competing deployment of the same frontend. The "staging" Environment
# below has no separate staging database (this project only has one
# Supabase project) and points straight at production, so it's configured
# with a required reviewer in GitHub's Environment settings — the same
# manual-approval gate deploy-production.yml relies on — rather than
# letting every push apply migrations/redeploy functions unreviewed.
on:
  push:
    branches: [main]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link staging project
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Apply migrations
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

  deploy-functions:
    runs-on: ubuntu-latest
    needs: [migrate]
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link staging project
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Tag this deploy's release for Sentry
        run: supabase secrets set SENTRY_RELEASE="${{ github.sha }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Deploy all Edge Functions
        run: supabase functions deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
